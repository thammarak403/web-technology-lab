<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ค้นหารายวิชา - ระบบบริการการศึกษา</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="logo">มหาวิทยาลัยแม่โจ้</div>
    <nav class="main-nav">
      <a href="#">เมนูหลัก</a>
      <a href="#">ถอยกลับ</a>
    </nav>
  </header>

  <main class="container">
    <h1>ค้นหารายวิชา</h1>

    <form class="search-form">
      <div class="form-group">
        <label for="subject-type">หมวดวิชา</label>
        <select id="subject-type" name="subject-type">
          <option>รหัสวิชาที่ยังใช้อยู่</option>
        </select>
      </div>

      <div class="form-group">
        <label for="dept">หน่วยงานเจ้าของรายวิชา</label>
        <select id="dept" name="dept">
          <option>ทั้งหมด</option>
        </select>
      </div>

      <div class="form-group">
        <label for="keyword">รหัสวิชา / ชื่อวิชา</label>
        <input type="text" id="keyword" name="keyword" placeholder="เช่น 102">
      </div>

      <button type="submit" class="btn-search">ค้นหา</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>Contact Staff: กลุ่มภารกิจทะเบียนเรียน</p>
  </footer>

</body>
</html>
